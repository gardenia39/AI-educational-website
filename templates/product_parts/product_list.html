<!-- Product List -->
<div class="row">
  {% for product in list_products %}
  <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-4">
    <!-- 整个 card 都可点击 -->
    <a href="{% url 'get_product' product.slug %}" class="card-product-link text-decoration-none text-dark">
      <figure class="card card-product-grid shadow-sm h-100 border-0 rounded-3 overflow-hidden">
        <div class="img-wrap" style="width: 100%; height: 180px; overflow: hidden; background: #f8f9fa;">
          <img src="{{product.product_images.first.image.url}}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'"/>
        </div>
        <figcaption class="info-wrap p-3 text-center bg-white border-top">
          <div class="title text-truncate" style="font-size: 1rem; font-weight: 600;">{{ product.product_name }}</div>
          <div class="price mt-2 text-primary" style="font-size: 1.1rem; font-weight: bold;">¥{{product.price|floatformat:"-2"}}</div>
        </figcaption>
      </figure>
    </a>
  </div>
  {% endfor %}
</div>
