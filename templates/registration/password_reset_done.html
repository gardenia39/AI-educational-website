{% extends "base/base.html" %}
{% block title %}重置密码邮件已发送{% endblock %}
{% block start %}

<style>
  .para-style {
    padding-bottom: 20px;
  }
</style>

<section class="section-content padding-bottom">
  <div class="container-xl d-flex justify-content-center align-items-center mt-5">
    <div class="row justify-content-center w-100">
      <div class="col-xl-5">
        <div class="card mb-4">
          <div class="card-header" style="text-align: center; font-size: 25px">
            重置密码邮件已发送
          </div>
          <div class="card-body text-center">
            <p class="para-style">
              如果该邮箱对应的账号存在，我们已将重置密码的指引发送到该邮箱，请稍候查收。
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary">返回登录</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
