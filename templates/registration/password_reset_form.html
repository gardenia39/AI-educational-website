{% extends "base/base.html" %}
{% block title %}重置密码{% endblock %}
{% block start %}

<style>
  .para-style{
    text-align: center;
    padding: 10px;
  }
</style>

<!-- ============================ COMPONENT Forgot Password   ================================= -->
<section class="section-content padding-bottom">
  <div class="container-xl d-flex justify-content-center align-items-center mt-5">
    <div class="row justify-content-center w-100">
      <div class="col-xl-4">
        <div class="card mb-4">
          <div class="card-header" style="text-align: center; font-size: 25px;">重置密码</div>
          <div class="card-body">
            <form method="POST">
              {% csrf_token %} {% include "base/alert.html" %}
              <p class="para-style">
                忘记密码了?请在下方输入注册时使用的邮箱，我们将发送重置密码的链接到该邮箱。
              </p>
              <div class="form-group">
                <input
                  class="form-control"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="请输入注册时使用的邮箱"
                  required
                  />
              </div>

              <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block">发送重置链接</button>
              </div>
              <a href="{% url 'login' %}" class="float-right">返回登录</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- ============================ COMPONENT Forgot Password END ================================= -->

{% endblock %}
