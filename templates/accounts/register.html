{% extends "base/base.html" %} {% load static %} {% load socialaccount %}
{% block title %}创建账号{% endblock %}
{% block start %}

<style>
  .auth-wrapper { padding: 2rem 0; }
  .auth-spacing { padding-bottom: 2rem; }
  .signup-card { position: relative; display: flex; flex-direction: column; min-width: 0; word-wrap: break-word; background-color: #fff; background-clip: border-box; border: 1px solid rgba(0,0,0,.125); border-radius: 0.25rem; }
  .signup-header { padding: 0.75rem 1.25rem; margin-bottom: 0; background-color: rgba(0,0,0,.03); border-bottom: 1px solid rgba(0,0,0,.125); }
  .signup-body { flex: 1 1 auto; min-height: 1px; padding: 1.25rem; }
  .field-wrap { margin-bottom: 1rem; }
</style>

<main class="auth-wrapper auth-spacing">
  <div class="container-xl d-flex justify-content-center align-items-center mt-5">
    <div class="row justify-content-center w-100">
      <div class="col-xl-4">
        <article class="signup-card mb-4">
          <header class="signup-header" style="text-align: center; font-size: 25px;">创建账号</header>
          <div class="signup-body">
            <form method="POST" id="signupForm">
              {% csrf_token %} {% include "base/alert.html" %}

              <div class="field-wrap">
                <input autocomplete="username" class="form-control" name="username" placeholder="账号名称" required type="text" />
              </div>

              <div class="field-wrap">
                <div class="input-group">
                  <input autocomplete="email" class="form-control" id="mailField" name="email" placeholder="电子邮箱" required type="email" />
                  <div class="input-group-append">
                    <button class="btn btn-outline-secondary" id="sendVerifyBtn" onclick="sendVerifyCode()" type="button">获取验证码</button>
                  </div>
                </div>
                <small class="form-text text-muted" id="verifyHint"></small>
              </div>

              <div class="field-wrap">
                <input autocomplete="off" class="form-control" id="otpField" maxlength="6" name="verify_code" placeholder="输入六位验证码" required type="text" />
              </div>

              <div class="field-wrap">
                <input class="form-control" name="password" placeholder="设置密码" required type="password" />
              </div>

              <div class="field-wrap mb-4 mt-4">
                <button style="width: 100%;" type="submit" class="btn btn-primary w-100">
                  创建账号
                </button>
              </div>

              <p class="text-center mt-4">
                已有账户？ <a href="{% url 'login' %}">立即登录</a>
              </p>

              <div class="line"></div>

              {% comment "第三方登录未配置，暂时隐藏" %}
                <div class="oauth-box">
                  <a href="{% provider_login_url 'facebook' %}" class="oauth-btn fb-connect">
                    <i class="bx bxl-facebook fb-logo"></i>
                    <span>Login with Facebook</span>
                  </a>
                </div>

                <div class="oauth-box">
                  <a href="{% provider_login_url 'google' %}?next=/" class="oauth-btn gg-connect">
                    <img alt="" class="gg-logo" src="{% static 'images/google.png' %}" />
                    <span>Login with Google</span>
                  </a>
                </div>
                {% endcomment %}
            </form>
          </div>
        </article>
      </div>
    </div>
  </div>
</main>

<script>
function sendVerifyCode() {
  const email = document.getElementById('mailField').value.trim();
  const btn = document.getElementById('sendVerifyBtn');
  const msg = document.getElementById('verifyHint');

  if (!email) {
    msg.style.color = 'red';
    msg.textContent = '请先填写邮箱';
    return;
  }

  btn.disabled = true;
  msg.style.color = '#555';
  msg.textContent = '正在发送...';

  fetch("{% url 'send_register_code' %}", {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
    },
    body: JSON.stringify({ email: email })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      msg.style.color = 'green';
      msg.textContent = data.message;
      startCountdown(btn, 60);
    } else {
      msg.style.color = 'red';
      msg.textContent = data.message;
      btn.disabled = false;
    }
  })
  .catch(() => {
    msg.style.color = 'red';
    msg.textContent = '请求失败，请检查网络';
    btn.disabled = false;
  });
}

function startCountdown(btn, seconds) {
  let remaining = seconds;
  btn.textContent = remaining + 's 后重发';
  const timer = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = '再次获取';
    } else {
      btn.textContent = remaining + 's 后重发';
    }
  }, 1000);
}
</script>

{% endblock %}
