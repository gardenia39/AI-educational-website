{% extends "base/base.html" %} {% load static %} {% load socialaccount %}
{% block title %}账号登录{% endblock %}
{% block start %}

<style>
  .auth-wrapper { padding: 2rem 0; }
  .auth-spacing { padding-bottom: 2rem; }
  .auth-card { position: relative; display: flex; flex-direction: column; min-width: 0; word-wrap: break-word; background-color: #fff; background-clip: border-box; border: 1px solid rgba(0,0,0,.125); border-radius: 0.25rem; }
  .auth-header { padding: 0.75rem 1.25rem; margin-bottom: 0; background-color: rgba(0,0,0,.03); border-bottom: 1px solid rgba(0,0,0,.125); }
  .auth-body { flex: 1 1 auto; min-height: 1px; padding: 1.25rem; }
  .input-wrap { margin-bottom: 1rem; }
  .remember-box { position: relative; display: block; min-height: 1.5rem; padding-left: 1.5rem; }
  .remember-input { width: 1rem; height: 1rem; margin-top: .25rem; vertical-align: top; background-color: #fff; background-repeat: no-repeat; background-position: center; background-size: contain; border: 1px solid rgba(0,0,0,.25); appearance: none; border-radius: .25em; }
  .remember-input:checked { background-color: #0d6efd; border-color: #0d6efd; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3cpath fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='M6 10l3 3l6-6'/%3e%3c/svg%3e"); }
  .remember-label { display: inline-block; margin-left: .5rem; }
</style>

<main class="auth-wrapper auth-spacing">
  <div class="container-xl d-flex justify-content-center align-items-center mt-5">
    <div class="row justify-content-center w-100">
      <div class="col-xl-4">
        <article class="auth-card mb-4">
          <header class="auth-header" style="font-size: 25px; text-align: center;">
            账号登录
          </header>
          <div class="auth-body">
            <form action="{% url 'login' %}?next={{ request.GET.next }}" method="POST">
              {% csrf_token %} {% include "base/alert.html" %}

              <div class="input-wrap">
                <input placeholder="账号名称" name="username" required type="text" class="form-control" />
              </div>
              <div class="input-wrap">
                <input placeholder="登录密码" name="password" type="password" class="form-control" />
              </div>

              <div class="input-wrap d-flex justify-content-between align-items-center mt-3 mb-3">
                <div class="remember-box">
                  <input checked type="checkbox" class="remember-input" id="keepLogin" />
                  <label for="keepLogin" class="remember-label">保持登录</label>
                </div>
                <a class="text-primary" href="{% url 'password_reset' %}">
                  找回密码？
                </a>
              </div>

              <div class="input-wrap mb-4">
                <button style="width: 100%;" type="submit" class="btn btn-primary w-100">
                  登录
                </button>
              </div>

              <p class="text-center mt-4">
                新用户？ <a href="{% url 'register' %}">立即注册</a>
              </p>

              <div class="line"></div>

              {% comment "第三方登录未配置，暂时隐藏" %}
              <div class="oauth-box">
                <a href="{% provider_login_url 'facebook' %}" class="oauth-btn fb-connect">
                  <i class="bx bxl-facebook fb-logo"></i>
                  <span>Login with Facebook</span>
                </a>
              </div>

              <div class="oauth-box">
                <a href="{% provider_login_url 'google' %}?next=/" class="oauth-btn gg-connect">
                  <img alt="" class="gg-logo" src="{% static 'images/google.png' %}" />
                  <span>Login with Google</span>
                </a>
              </div>
              {% endcomment %}
            </form>
          </div>
        </article>
      </div>
    </div>
  </div>
</main>

{% endblock %}
