{% extends "base/base.html" %} {% load static %} {% load socialaccount %}
{% block title %}登录{% endblock %}
{% block start %}

<!-- ============================ COMPONENT LOGIN   ================================= -->
<section class="section-content padding-bottom">
  <div class="container-xl d-flex justify-content-center align-items-center mt-5">
    <div class="row justify-content-center w-100">
      <div class="col-xl-4">
        <div class="card mb-4">
          <div class="card-header" style="text-align: center; font-size: 25px">
            登录
          </div>
          <div class="card-body">
            <form method="POST" action="{% url 'login' %}?next={{ request.GET.next }}">
              {% csrf_token %} {% include "base/alert.html" %}

              <div class="form-group">
                <input class="form-control" required name="username" type="text" placeholder="用户名" />
              </div>
              <!-- form-group// -->
              <div class="form-group">
                <input class="form-control" placeholder="密码" name="password" type="password" />
              </div>
              <!-- form-group// -->

              <div class="form-group">
                <a href="{% url 'password_reset' %}" class="float-right">
                  忘记密码？
                </a>
                <label class="float-left custom-control custom-checkbox">
                  <input type="checkbox" class="custom-control-input" checked />
                  <div class="custom-control-label">记住我</div>
                </label>
              </div>

              <!-- form-group// -->
              <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block">
                  登录
                </button>
              </div>

              <p class="text-center mt-4">
                还没有账号？ <a href="{% url 'register' %}">注册</a>
              </p>

              <div class="line"></div>

              {% comment "第三方登录未配置，暂时隐藏" %}
              <div class="media-options">
                <a href="{% provider_login_url 'facebook' %}" class="field facebook">
                  <i class="bx bxl-facebook facebook-icon"></i>
                  <span>Login with Facebook</span>
                </a>
              </div>

              <div class="media-options">
                <a href="{% provider_login_url 'google' %}?next=/" class="field google">
                  <img src="{% static 'images/google.png' %}" alt="" class="google-img" />
                  <span>Login with Google</span>
                </a>
              </div>
              {% endcomment %}
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- ============================ COMPONENT LOGIN END ================================= -->

{% endblock %}
